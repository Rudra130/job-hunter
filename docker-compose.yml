version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jobpilot-db
    environment:
      POSTGRES_USER: jobpilot_user
      POSTGRES_PASSWORD: jobpilot_password
      POSTGRES_DB: jobpilot_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot_user -d jobpilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobpilot-backend
    environment:
      - DATABASE_URL=postgresql://jobpilot_user:jobpilot_password@db:5432/jobpilot_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=jobpilot-production-secret-key-32chars
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - LLM_MODEL=${LLM_MODEL:-meta/llama-3.1-70b-instruct}
      - MOCK_AI_RESPONSES=${MOCK_AI_RESPONSES:-false}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jobpilot-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
